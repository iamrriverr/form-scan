<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR 框框調整工具</title>
<style>
:root, [data-theme="light"] {
  --color-bg: #f7f6f2;
  --color-surface: #f9f8f5;
  --color-surface-2: #fbfbf9;
  --color-surface-offset: #f3f0ec;
  --color-surface-offset-2: #edeae5;
  --color-surface-dynamic: #e6e4df;
  --color-divider: #dcd9d5;
  --color-border: #d4d1ca;
  --color-text: #28251d;
  --color-text-muted: #7a7974;
  --color-text-faint: #bab9b4;
  --color-text-inverse: #f9f8f4;
  --color-primary: #01696f;
  --color-primary-hover: #0c4e54;
  --color-primary-active: #0f3638;
  --color-primary-highlight: #cedcd8;
  --color-error: #a12c7b;
  --color-error-highlight: #e0ced7;
  --color-success: #437a22;
  --color-success-highlight: #d4dfcc;
  --color-warning: #964219;
  --color-blue: #006494;
  --color-orange: #da7101;
  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
  --shadow-lg: 0 12px 32px oklch(0.2 0.01 80 / 0.12);
  --font-body: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
  --text-xs: 0.78rem;
  --text-sm: 0.9rem;
  --text-base: 1rem;
  --text-lg: 1.2rem;
  --text-xl: 1.5rem;
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
  --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
  --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
}
[data-theme="dark"] {
  --color-bg: #171614;
  --color-surface: #1c1b19;
  --color-surface-2: #201f1d;
  --color-surface-offset: #1d1c1a;
  --color-surface-offset-2: #22211f;
  --color-surface-dynamic: #2d2c2a;
  --color-divider: #262523;
  --color-border: #393836;
  --color-text: #cdccca;
  --color-text-muted: #797876;
  --color-text-faint: #5a5957;
  --color-text-inverse: #2b2a28;
  --color-primary: #4f98a3;
  --color-primary-hover: #227f8b;
  --color-primary-active: #1a626b;
  --color-primary-highlight: #313b3b;
  --color-error: #d163a7;
  --color-error-highlight: #4c3d46;
  --color-success: #6daa45;
  --color-success-highlight: #3a4435;
  --color-warning: #bb653b;
  --color-blue: #5591c7;
  --color-orange: #fdab43;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
  --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.4);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
body {
  min-height: 100dvh;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-text);
  background: var(--color-bg);
  display: flex;
  flex-direction: column;
}
button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
input, select { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-3) var(--space-6);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  gap: var(--space-4);
  position: sticky; top: 0; z-index: 100;
}
.logo {
  display: flex; align-items: center; gap: var(--space-2);
  font-weight: 700; font-size: var(--text-base); color: var(--color-text);
  text-decoration: none;
}
.logo svg { color: var(--color-primary); }
.header-actions { display: flex; align-items: center; gap: var(--space-2); }
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-4); border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: 500; transition: background var(--transition-interactive), color var(--transition-interactive), border-color var(--transition-interactive);
  border: 1px solid transparent;
}
.btn-primary { background: var(--color-primary); color: var(--color-text-inverse); }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-ghost { color: var(--color-text-muted); border-color: var(--color-border); }
.btn-ghost:hover { background: var(--color-surface-offset); color: var(--color-text); }
.btn-danger { background: var(--color-error); color: white; }
.btn-danger:hover { opacity: 0.85; }
.btn-sm { padding: var(--space-1) var(--space-3); font-size: var(--text-xs); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: var(--radius-md);
  color: var(--color-text-muted); transition: background var(--transition-interactive), color var(--transition-interactive);
}
.icon-btn:hover { background: var(--color-surface-offset); color: var(--color-text); }

/* ── Main Layout ── */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr 280px;
  flex: 1;
  overflow: hidden;
  height: calc(100dvh - 53px);
}

/* ── Side Panels ── */
.panel {
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel.right { border-right: none; border-left: 1px solid var(--color-border); }
.panel-header {
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-divider);
  font-weight: 600; font-size: var(--text-sm);
  display: flex; align-items: center; justify-content: space-between;
}
.panel-body { padding: var(--space-4); overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: var(--space-3); }

/* ── Canvas Area ── */
.canvas-area {
  display: flex; flex-direction: column;
  background: var(--color-bg);
  overflow: hidden; position: relative;
}
.canvas-toolbar {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-surface-2);
  flex-wrap: wrap;
}
.toolbar-group {
  display: flex; align-items: center; gap: var(--space-1);
  padding-right: var(--space-3);
  border-right: 1px solid var(--color-divider);
}
.toolbar-group:last-child { border-right: none; }
.tool-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  color: var(--color-text-muted); font-size: 14px;
  transition: background var(--transition-interactive), color var(--transition-interactive);
}
.tool-btn:hover { background: var(--color-surface-offset); color: var(--color-text); }
.tool-btn.active { background: var(--color-primary-highlight); color: var(--color-primary); }
.zoom-display {
  font-size: var(--text-xs); color: var(--color-text-muted); 
  padding: 0 var(--space-2); min-width: 45px; text-align: center;
  font-variant-numeric: tabular-nums;
}

.canvas-scroll {
  flex: 1; overflow: auto;
  display: flex; align-items: flex-start; justify-content: flex-start;
  padding: var(--space-8);
}
.canvas-container {
  position: relative;
  user-select: none;
  flex-shrink: 0;
  box-shadow: var(--shadow-lg);
}
#canvas-img {
  display: block;
  border-radius: var(--radius-sm);
}
#ocr-overlay {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* ── OCR Boxes ── */
.ocr-box {
  position: absolute;
  border: 2px solid var(--color-primary);
  border-radius: 2px;
  cursor: move;
  pointer-events: all;
  transition: border-color var(--transition-interactive), box-shadow var(--transition-interactive);
  box-sizing: border-box;
}
.ocr-box:hover {
  border-color: var(--color-orange);
  box-shadow: 0 0 0 1px var(--color-orange), inset 0 0 0 1000px oklch(from var(--color-orange) l c h / 0.06);
}
.ocr-box.selected {
  border-color: var(--color-orange);
  box-shadow: 0 0 0 2px var(--color-orange), inset 0 0 0 1000px oklch(from var(--color-orange) l c h / 0.08);
}
.ocr-box .box-label {
  position: absolute;
  top: -22px; left: -2px;
  background: var(--color-primary);
  color: white;
  font-size: 11px; font-weight: 600;
  padding: 2px 6px;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  white-space: nowrap;
  max-width: 140px;
  overflow: hidden; text-overflow: ellipsis;
  pointer-events: none;
  line-height: 1.4;
}
.ocr-box.selected .box-label { background: var(--color-orange); }
.resize-handle {
  position: absolute;
  width: 10px; height: 10px;
  background: var(--color-orange);
  border: 2px solid var(--color-bg);
  border-radius: 2px;
  pointer-events: all;
  z-index: 10;
}
.resize-handle.nw { top: -6px; left: -6px; cursor: nw-resize; }
.resize-handle.ne { top: -6px; right: -6px; cursor: ne-resize; }
.resize-handle.sw { bottom: -6px; left: -6px; cursor: sw-resize; }
.resize-handle.se { bottom: -6px; right: -6px; cursor: se-resize; }
.resize-handle.n  { top: -6px; left: calc(50% - 5px); cursor: n-resize; }
.resize-handle.s  { bottom: -6px; left: calc(50% - 5px); cursor: s-resize; }
.resize-handle.w  { left: -6px; top: calc(50% - 5px); cursor: w-resize; }
.resize-handle.e  { right: -6px; top: calc(50% - 5px); cursor: e-resize; }

/* ── Box list ── */
.box-list-item {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background var(--transition-interactive);
  border: 1px solid transparent;
  font-size: var(--text-xs);
}
.box-list-item:hover { background: var(--color-surface-offset); }
.box-list-item.active {
  background: var(--color-primary-highlight);
  border-color: oklch(from var(--color-primary) l c h / 0.2);
  color: var(--color-primary);
}
.box-color-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.box-list-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.box-delete-btn {
  opacity: 0; padding: 2px 4px; border-radius: var(--radius-sm);
  font-size: 11px; color: var(--color-error); transition: opacity var(--transition-interactive);
}
.box-list-item:hover .box-delete-btn { opacity: 1; }

/* ── Properties panel ── */
.prop-group { display: flex; flex-direction: column; gap: var(--space-2); }
.prop-label { font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 500; }
.prop-row { display: flex; gap: var(--space-2); align-items: center; }
.prop-input-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.prop-input-label { font-size: 10px; color: var(--color-text-faint); }
.prop-input {
  width: 100%;
  background: var(--color-surface-offset);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-2);
  font-size: var(--text-xs);
  color: var(--color-text);
  font-variant-numeric: tabular-nums;
  transition: border-color var(--transition-interactive);
}
.prop-input:focus { outline: none; border-color: var(--color-primary); }
.text-area {
  width: 100%; resize: none;
  background: var(--color-surface-offset);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-xs);
  color: var(--color-text);
  line-height: 1.5;
  min-height: 80px;
  transition: border-color var(--transition-interactive);
}
.text-area:focus { outline: none; border-color: var(--color-primary); }

/* ── Confidence badge ── */
.conf-badge {
  display: inline-flex; align-items: center; gap: var(--space-1);
  padding: 2px 8px; border-radius: var(--radius-full);
  font-size: 11px; font-weight: 600;
}
.conf-high { background: var(--color-success-highlight); color: var(--color-success); }
.conf-mid  { background: var(--color-primary-highlight); color: var(--color-primary); }
.conf-low  { background: var(--color-error-highlight); color: var(--color-error); }

/* ── Drop zone ── */
.drop-zone {
  border: 2px dashed var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-10) var(--space-8);
  text-align: center; display: flex; flex-direction: column;
  align-items: center; gap: var(--space-3);
  cursor: pointer; transition: border-color var(--transition-interactive), background var(--transition-interactive);
  color: var(--color-text-muted);
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--color-primary);
  background: var(--color-primary-highlight);
  color: var(--color-primary);
}
.drop-zone input[type=file] { display: none; }

/* ── Status bar ── */
.status-bar {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-1) var(--space-4);
  border-top: 1px solid var(--color-divider);
  font-size: 11px; color: var(--color-text-faint);
  background: var(--color-surface);
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-success); }
.status-sep { color: var(--color-divider); }

/* ── Empty state ── */
.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: var(--space-4); text-align: center;
  color: var(--color-text-muted); padding: var(--space-8);
}
.empty-state h3 { font-size: var(--text-base); color: var(--color-text); }
.empty-state p { font-size: var(--text-xs); max-width: 30ch; }

/* ── Context menu ── */
.context-menu {
  position: fixed; z-index: 999;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  padding: var(--space-1);
  min-width: 160px;
  display: none;
}
.context-menu.visible { display: block; }
.ctx-item {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  cursor: pointer;
  transition: background var(--transition-interactive);
}
.ctx-item:hover { background: var(--color-surface-offset); }
.ctx-item.danger { color: var(--color-error); }
.ctx-item.danger:hover { background: var(--color-error-highlight); }
.ctx-sep { height: 1px; background: var(--color-divider); margin: var(--space-1) 0; }

/* ── Selection rect ── */
#selection-rect {
  position: absolute; border: 1px dashed var(--color-primary);
  background: oklch(from var(--color-primary) l c h / 0.1);
  pointer-events: none; display: none;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-text-faint); }

/* ── Divider ── */
.divider { height: 1px; background: var(--color-divider); }

/* ── Tag chip ── */
.tag-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: var(--radius-full);
  font-size: 11px; background: var(--color-surface-offset-2);
  color: var(--color-text-muted); border: 1px solid var(--color-border);
}

/* ── Add Box btn ── */
.add-box-mode-btn.active { background: var(--color-orange) !important; color: white !important; border-color: var(--color-orange) !important; }

/* ── Kbd ── */
kbd {
  display: inline-block; padding: 1px 5px; border-radius: 3px;
  font-size: 10px; font-family: monospace;
  background: var(--color-surface-dynamic); border: 1px solid var(--color-border);
  color: var(--color-text-muted);
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <a href="#" class="logo">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
      <rect x="13" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
      <rect x="2" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
      <rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 1.5"/>
    </svg>
    欄位框確認
  </a>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" id="import-json-btn" title="匯入 JSON">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      匯入 JSON
    </button>
    <button class="btn btn-primary btn-sm" id="apply-btn" title="套用修改">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      套用修改
    </button>
    <button class="btn btn-ghost btn-sm" id="export-json-btn" title="匯出 JSON">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      匯出 JSON
    </button>
    <button class="icon-btn" data-theme-toggle aria-label="切換主題">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <!-- Left Panel: Box List -->
  <aside class="panel">
    <div class="panel-header">
      <span>可填欄位清單</span>
      <span id="box-count" class="tag-chip">0 個</span>
    </div>
    <div class="panel-body" id="box-list-container">
      <div class="empty-state" id="box-list-empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <p>尚未建立任何欄位框</p>
      </div>
      <div id="box-list"></div>
    </div>
    <div style="padding: var(--space-4); border-top: 1px solid var(--color-divider); display:flex; flex-direction:column; gap:var(--space-2);">
      <button class="btn btn-ghost btn-sm" id="select-all-btn" style="justify-content:center;">全選</button>
      <button class="btn btn-danger btn-sm" id="delete-selected-btn" style="justify-content:center;" disabled>刪除選取</button>
    </div>
  </aside>

  <!-- Canvas Area -->
  <main class="canvas-area">
    <div class="canvas-toolbar">
      <div class="toolbar-group">
        <button class="tool-btn active" id="tool-select" title="選取工具 (V)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l7 18 3-7 7-3z"/></svg>
        </button>
        <button class="tool-btn add-box-mode-btn" id="tool-draw" title="繪製新框 (B)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </button>
      </div>
      <div class="toolbar-group">
        <button class="tool-btn" id="zoom-out-btn" title="縮小 (-)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <span class="zoom-display" id="zoom-display">100%</span>
        <button class="tool-btn" id="zoom-in-btn" title="放大 (+)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button class="tool-btn" id="zoom-fit-btn" title="符合視窗">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button class="tool-btn" id="zoom-reset-btn" title="100%">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </button>

        <button class="tool-btn" id="undo-btn" title="復原 (Ctrl+Z)">

        </button>
        <button class="tool-btn" id="redo-btn" title="重做 (Ctrl+Y)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
        </button>

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>

        <label class="drop-zone" id="drop-zone">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/></svg>
          <strong>拖曳圖片至此</strong>
          <span style="font-size:var(--text-xs)">或點擊上傳 PNG、JPG、WEBP</span>
          <input type="file" id="drop-zone-input" accept="image/*">
        </label>

      <!-- Canvas container (hidden until image loaded) -->
      <div class="canvas-container" id="canvas-container" style="display:none; position:relative;">
        <img id="canvas-img" alt="OCR 目標圖片" draggable="false">

          <div id="selection-rect"></div>

    <!-- Status bar -->
    <div class="status-bar">
      <span class="status-dot"></span>
      <span id="status-msg">就緒</span>
      <span class="status-sep">|</span>
      <span id="cursor-pos">x: -, y: -</span>
      <span class="status-sep">|</span>
      <span id="img-size-info">圖片尺寸: -</span>
      <span class="status-sep">|</span>
      <span>拖曳或調整填寫框後按「套用修改」</span>
    </div>
  </main>

  <!-- Right Panel: Properties -->
  <aside class="panel right">
    <div class="panel-header">
      <span>屬性</span>
    </div>
    <div class="panel-body" id="properties-panel">
      <div class="empty-state">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <p>選取 OCR 框框以編輯屬性</p>
      </div>
    </div>
  </aside>
</div>

<!-- Context menu -->
<div class="context-menu" id="context-menu">
  <div class="ctx-item" id="ctx-select-all">全選所有框框</div>
  <div class="ctx-item" id="ctx-deselect">取消選取</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" id="ctx-add">新增框框 (於此位置)</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" id="ctx-delete">刪除選取</div>
</div>

<!-- Import hidden inputs -->
<input type="file" id="import-json-input" accept=".json" style="display:none">

<script>
// ─── Streamlit bridge ─────────────────────────────────────────────────────────
const streamlit = {
  connected: false,
  args: {},
};

function sendStreamlitMessage(type, data = {}) {
  window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, '*');
}

function setFrameHeight() {
  const height = Number(streamlit.args.height || 760);
  sendStreamlitMessage('streamlit:setFrameHeight', { height });
}

function setComponentValue(value) {
  sendStreamlitMessage('streamlit:setComponentValue', { value });
}

sendStreamlitMessage('streamlit:componentReady', { apiVersion: 1 });

window.addEventListener('message', (event) => {
  const data = event.data || {};
  if (data.type !== 'streamlit:render') return;
  streamlit.connected = true;
  streamlit.args = data.args || {};
  loadComponentData(streamlit.args);
  setFrameHeight();
});

// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  boxes: [],
  selectedIds: new Set(),
  zoom: 1,
  tool: 'select', // 'select' | 'draw'
  imgNaturalW: 0,
  imgNaturalH: 0,
  imgLoaded: false,
  history: [],
  historyIndex: -1,
  drawing: false,
  drawStart: null,
  dragging: false,
  dragBox: null,
  dragOffsets: [],
  resizing: false,
  resizeBox: null,
  resizeHandle: null,
  resizeStart: null,
  selRect: false,
  selRectStart: null,
  ctxMenuPos: { x: 0, y: 0 },
  nextId: 1,
  originalFields: [],
  initializedFromStreamlit: false,
};

// ─── Colors ──────────────────────────────────────────────────────────────────
const BOX_COLORS = ['#4f98a3', '#fdab43', '#6daa45', '#d163a7', '#5591c7', '#dd6974', '#bb653b', '#a86fdf'];
function boxColor(idx) { return BOX_COLORS[idx % BOX_COLORS.length]; }

const ADDRESS_FIELD_KEYS = new Set(['applicant_address', 'applicant_contact_address', 'guarantor_address']);
const ADDRESS_SUB_LABELS = [
  ['county', '縣/市'],
  ['district', '鄉鎮/市區'],
  ['road', '路/街'],
  ['section', '段'],
  ['lane', '巷'],
  ['alley', '弄'],
  ['number', '號'],
  ['floor', '樓'],
];

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const canvasImg = document.getElementById('canvas-img');
const ocrOverlay = document.getElementById('ocr-overlay');
const canvasContainer = document.getElementById('canvas-container');
const dropZoneWrap = document.getElementById('drop-zone-wrap');
const dropZoneInput = document.getElementById('drop-zone-input');
const uploadImage = document.getElementById('upload-image');
const canvasScroll = document.getElementById('canvas-scroll');
const boxList = document.getElementById('box-list');
const boxListEmpty = document.getElementById('box-list-empty');
const boxCount = document.getElementById('box-count');
const selectionRect = document.getElementById('selection-rect');
const propertiesPanel = document.getElementById('properties-panel');
const zoomDisplay = document.getElementById('zoom-display');
const statusMsg = document.getElementById('status-msg');
const cursorPos = document.getElementById('cursor-pos');
const imgSizeInfo = document.getElementById('img-size-info');
const contextMenu = document.getElementById('context-menu');
const deleteSelectedBtn = document.getElementById('delete-selected-btn');

// ─── History ─────────────────────────────────────────────────────────────────
function saveHistory() {
  const snap = JSON.parse(JSON.stringify(state.boxes));
  state.history = state.history.slice(0, state.historyIndex + 1);
  state.history.push(snap);
  if (state.history.length > 100) state.history.shift();
  else state.historyIndex++;
}
function undo() {
  if (state.historyIndex <= 0) return;
  state.historyIndex--;
  state.boxes = JSON.parse(JSON.stringify(state.history[state.historyIndex]));
  state.selectedIds.clear();
  render();
}
function redo() {
  if (state.historyIndex >= state.history.length - 1) return;
  state.historyIndex++;
  state.boxes = JSON.parse(JSON.stringify(state.history[state.historyIndex]));
  state.selectedIds.clear();
  render();
}

// ─── Box creation ─────────────────────────────────────────────────────────────
function createBox(x, y, w, h, text = '', conf = 0.95, extra = {}) {
  const id = 'box_' + (state.nextId++);
  const colorIdx = state.boxes.length;
  return {
    id, x: Math.round(x), y: Math.round(y),
    w: Math.round(Math.max(w, 10)), h: Math.round(Math.max(h, 10)),
    text: text || `文字區塊 ${state.nextId - 1}`,
    confidence: conf,
    color: boxColor(colorIdx),
    label: `區塊 ${state.nextId - 1}`,
    fieldKey: '',
    fieldIndex: null,
    page: null,
    boxType: 'field',
    parentFieldKey: '',
    subKey: '',
    originalField: null,
    ...extra,
  };
}

function bboxToBoxRect(bbox) {
  const x1 = Number(bbox?.x1 ?? bbox?.x ?? 0);
  const y1 = Number(bbox?.y1 ?? bbox?.y ?? 0);
  const x2 = Number(bbox?.x2 ?? (x1 + (bbox?.width ?? bbox?.w ?? 100)));
  const y2 = Number(bbox?.y2 ?? (y1 + (bbox?.height ?? bbox?.h ?? 40)));
  return {
    x: Math.round(x1),
    y: Math.round(y1),
    w: Math.round(Math.max(x2 - x1, 10)),
    h: Math.round(Math.max(y2 - y1, 10)),
  };
}

function fieldToBox(field, index) {
  const rect = bboxToBoxRect(field.fill_bbox || field.bbox || {});
  return createBox(
    rect.x,
    rect.y,
    rect.w,
    rect.h,
    field.field_key || field.label_text || '',
    field.confidence ?? 1,
    {
      id: field.id || `field_${index + 1}`,
      label: field.label_text || field.field_key || `欄位 ${index + 1}`,
      fieldKey: field.field_key || '',
      fieldIndex: index,
      page: field.page ?? 1,
      originalField: JSON.parse(JSON.stringify(field)),
      color: boxColor(index),
    }
  );
}

function addressSubBoxes(field, index) {
  const fillRect = bboxToBoxRect(field.fill_bbox || field.bbox || {});
  const subBboxes = field.sub_bboxes || {};
  const gap = 6;
  const count = ADDRESS_SUB_LABELS.length;
  const autoW = Math.max(22, Math.floor((fillRect.w - gap * (count - 1)) / count));

  return ADDRESS_SUB_LABELS.map(([subKey, subLabel], subIndex) => {
    const existing = subBboxes[subKey];
    const rect = existing
      ? bboxToBoxRect(existing)
      : {
          x: fillRect.x + subIndex * (autoW + gap),
          y: fillRect.y,
          w: subIndex === count - 1 ? Math.max(22, fillRect.x + fillRect.w - (fillRect.x + subIndex * (autoW + gap))) : autoW,
          h: fillRect.h,
        };
    return createBox(
      rect.x,
      rect.y,
      rect.w,
      rect.h,
      `${field.field_key}.${subKey}`,
      field.confidence ?? 1,
      {
        id: `${field.field_key || 'address'}_${index}_${subKey}`,
        label: `${field.label_text || field.field_key} / ${subLabel}`,
        fieldKey: `${field.field_key}.${subKey}`,
        fieldIndex: index,
        page: field.page ?? 1,
        boxType: 'address_sub',
        parentFieldKey: field.field_key || '',
        subKey,
        originalField: JSON.parse(JSON.stringify(field)),
        color: boxColor(subIndex),
      }
    );
  });
}

function fieldToBoxes(field, index) {
  if (ADDRESS_FIELD_KEYS.has(field.field_key)) return addressSubBoxes(field, index);
  return [fieldToBox(field, index)];
}

function boxToFillBbox(box) {
  return {
    x1: Math.round(box.x),
    y1: Math.round(box.y),
    x2: Math.round(box.x + box.w),
    y2: Math.round(box.y + box.h),
  };
}

function unionBboxes(bboxes) {
  if (!bboxes.length) return null;
  return {
    x1: Math.min(...bboxes.map(b => b.x1)),
    y1: Math.min(...bboxes.map(b => b.y1)),
    x2: Math.max(...bboxes.map(b => b.x2)),
    y2: Math.max(...bboxes.map(b => b.y2)),
  };
}

function exportFields() {
  const fields = state.originalFields.map(field => JSON.parse(JSON.stringify(field)));
  const customFields = [];

  state.boxes.forEach((box, boxIndex) => {
    if (box.boxType === 'address_sub') return;
    const base = fields[box.fieldIndex] || {};
    base.label_text = box.label || base.label_text || `欄位 ${boxIndex + 1}`;
    base.field_key = box.fieldKey || box.text || base.field_key || `custom_field_${boxIndex + 1}`;
    base.confidence = Number(box.confidence ?? base.confidence ?? 1);
    base.page = Number(box.page ?? base.page ?? 1);
    base.fill_bbox = boxToFillBbox(box);
    if (fields[box.fieldIndex]) fields[box.fieldIndex] = base;
    else customFields.push(base);
  });

  fields.forEach((field, fieldIndex) => {
    if (!ADDRESS_FIELD_KEYS.has(field.field_key)) return;
    const subBoxes = state.boxes.filter(box => box.boxType === 'address_sub' && box.fieldIndex === fieldIndex);
    const subBboxes = {};
    subBoxes.forEach(box => {
      subBboxes[box.subKey] = boxToFillBbox(box);
    });
    field.sub_bboxes = subBboxes;
    const union = unionBboxes(Object.values(subBboxes));
    if (union) field.fill_bbox = union;
  });

  return fields.concat(customFields);
}

function loadComponentData(args) {
  if (state.initializedFromStreamlit) return;
  const fields = Array.isArray(args.fields) ? args.fields : [];
  const imageDataUrl = args.image_data_url || '';

  state.originalFields = JSON.parse(JSON.stringify(fields));
  state.boxes = fields.flatMap(fieldToBoxes);
  state.nextId = state.boxes.length + 1;
  state.selectedIds.clear();
  state.history = [];
  state.historyIndex = -1;
  saveHistory();

  if (imageDataUrl) {
    loadImage(imageDataUrl);
  } else {
    render();
  }
  state.initializedFromStreamlit = true;
  statusMsg.textContent = `已載入 ${state.boxes.length} 個可填欄位`;
}

// ─── Coordinate helpers ───────────────────────────────────────────────────────
function clientToCanvas(cx, cy) {
  const rect = canvasContainer.getBoundingClientRect();
  return {
    x: (cx - rect.left) / state.zoom,
    y: (cy - rect.top) / state.zoom,
  };
}

// ─── Rendering ────────────────────────────────────────────────────────────────
function render() {
  renderBoxes();
  renderBoxList();
  renderProperties();
  updateDeleteBtn();
}

function renderBoxes() {
  // Remove old boxes (keep selection-rect)
  const oldBoxes = ocrOverlay.querySelectorAll('.ocr-box');
  oldBoxes.forEach(el => el.remove());

  state.boxes.forEach(box => {
    const el = document.createElement('div');
    el.className = 'ocr-box' + (state.selectedIds.has(box.id) ? ' selected' : '');
    el.style.left = (box.x * state.zoom) + 'px';
    el.style.top = (box.y * state.zoom) + 'px';
    el.style.width = (box.w * state.zoom) + 'px';
    el.style.height = (box.h * state.zoom) + 'px';
    el.style.borderColor = box.color;
    if (state.selectedIds.has(box.id)) {
      el.style.boxShadow = `0 0 0 2px ${box.color}, inset 0 0 0 1000px ${box.color}18`;
    }
    el.dataset.id = box.id;

    // Label
    const label = document.createElement('div');
    label.className = 'box-label';
    label.style.background = box.color;
    label.textContent = box.label || box.text.slice(0, 20);
    el.appendChild(label);

    // Resize handles (only when selected)
    if (state.selectedIds.has(box.id)) {
      ['nw','n','ne','w','e','sw','s','se'].forEach(dir => {
        const h = document.createElement('div');
        h.className = 'resize-handle ' + dir;
        h.style.background = box.color;
        h.dataset.handle = dir;
        h.dataset.boxId = box.id;
        el.appendChild(h);
      });
    }

    el.addEventListener('mousedown', onBoxMouseDown);
    el.addEventListener('contextmenu', onBoxContextMenu);
    ocrOverlay.appendChild(el);
  });
}

function renderBoxList() {
  const isEmpty = state.boxes.length === 0;
  boxListEmpty.style.display = isEmpty ? 'flex' : 'none';
  boxList.innerHTML = '';
  boxCount.textContent = state.boxes.length + ' 個';

  state.boxes.forEach((box, i) => {
    const item = document.createElement('div');
    item.className = 'box-list-item' + (state.selectedIds.has(box.id) ? ' active' : '');
    item.dataset.id = box.id;
    item.innerHTML = `
      <div class="box-color-dot" style="background:${box.color}"></div>
      <span class="box-list-text">${escHtml(box.label || box.text.slice(0,20))}</span>
      <button class="box-delete-btn" data-id="${box.id}" title="刪除">✕</button>
    `;
    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('box-delete-btn')) {
        const id = e.target.dataset.id;
        saveHistory();
        state.boxes = state.boxes.filter(b => b.id !== id);
        state.selectedIds.delete(id);
        render();
        return;
      }
      if (!e.shiftKey && !e.ctrlKey && !e.metaKey) state.selectedIds.clear();
      state.selectedIds.add(box.id);
      render();
      scrollBoxIntoView(box.id);
    });
    boxList.appendChild(item);
  });
}

function renderProperties() {
  if (state.selectedIds.size === 0) {
    propertiesPanel.innerHTML = `<div class="empty-state">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <p>選取 OCR 框框以編輯屬性</p>
    </div>`;
    return;
  }

  if (state.selectedIds.size > 1) {
    const ids = [...state.selectedIds];
    propertiesPanel.innerHTML = `<div class="prop-group">
      <div class="prop-label">已選取 ${ids.length} 個框框</div>
      <button class="btn btn-danger btn-sm" id="prop-delete-selected">刪除全部選取</button>
    </div>`;
    document.getElementById('prop-delete-selected').onclick = deleteSelected;
    return;
  }

  const id = [...state.selectedIds][0];
  const box = state.boxes.find(b => b.id === id);
  if (!box) return;

  const confClass = box.confidence >= 0.9 ? 'conf-high' : box.confidence >= 0.6 ? 'conf-mid' : 'conf-low';
  const confPct = Math.round(box.confidence * 100);

  propertiesPanel.innerHTML = `
    <div class="prop-group">
      <div class="prop-label">標籤</div>
      <input class="prop-input" id="prop-label" value="${escHtml(box.label)}" placeholder="標籤名稱">
    </div>
    <div class="prop-group">
      <div class="prop-label">欄位鍵</div>
      <input class="prop-input" id="prop-field-key" value="${escHtml(box.fieldKey || box.text)}" placeholder="例如 applicant_name">
    </div>
    ${box.boxType === 'address_sub' ? `
    <div class="prop-group">
      <div class="prop-label">地址子欄位</div>
      <input class="prop-input" value="${escHtml(box.parentFieldKey)} / ${escHtml(box.subKey)}" disabled>
    </div>` : ''}
    <div class="divider"></div>
    <div class="prop-group">
      <div class="prop-label">位置 &amp; 尺寸</div>
      <div class="prop-row">
        <div class="prop-input-wrap"><div class="prop-input-label">X</div><input class="prop-input" id="prop-x" type="number" value="${box.x}"></div>
        <div class="prop-input-wrap"><div class="prop-input-label">Y</div><input class="prop-input" id="prop-y" type="number" value="${box.y}"></div>
      </div>
      <div class="prop-row">
        <div class="prop-input-wrap"><div class="prop-input-label">寬 W</div><input class="prop-input" id="prop-w" type="number" value="${box.w}"></div>
        <div class="prop-input-wrap"><div class="prop-input-label">高 H</div><input class="prop-input" id="prop-h" type="number" value="${box.h}"></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="prop-group">
      <div class="prop-label">備註 / 原始文字</div>
      <textarea class="text-area" id="prop-text">${escHtml(box.text)}</textarea>
    </div>
    <div class="prop-group">
      <div class="prop-label">信心度</div>
      <div style="display:flex;align-items:center;gap:var(--space-2);">
        <input class="prop-input" id="prop-conf" type="number" min="0" max="1" step="0.01" value="${box.confidence}" style="width:80px;">
        <span class="conf-badge ${confClass}">${confPct}%</span>
      </div>
    </div>
    <div class="divider"></div>
    <button class="btn btn-danger btn-sm" id="prop-delete-btn" style="justify-content:center;width:100%;">刪除此框框</button>
  `;

  // Events
  const bind = (id, prop, parse) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('change', () => {
      saveHistory();
      const val = parse ? parse(el.value) : el.value;
      box[prop] = val;
      if (prop === 'confidence') renderConfBadge(val);
      render();
    });
    el.addEventListener('input', () => {
      if (prop === 'x' || prop === 'y' || prop === 'w' || prop === 'h') {
        const val = parse(el.value);
        box[prop] = val; renderBoxes();
      }
    });
  };

  bind('prop-label', 'label');
  bind('prop-field-key', 'fieldKey');
  bind('prop-x', 'x', v => Math.max(0, parseInt(v)||0));
  bind('prop-y', 'y', v => Math.max(0, parseInt(v)||0));
  bind('prop-w', 'w', v => Math.max(1, parseInt(v)||1));
  bind('prop-h', 'h', v => Math.max(1, parseInt(v)||1));
  bind('prop-text', 'text');
  bind('prop-conf', 'confidence', v => Math.max(0, Math.min(1, parseFloat(v)||0)));

  document.getElementById('prop-delete-btn').onclick = () => {
    saveHistory();
    state.boxes = state.boxes.filter(b => b.id !== id);
    state.selectedIds.delete(id);
    render();
  };
}

function renderConfBadge(val) {
  const badge = document.querySelector('.conf-badge');
  if (!badge) return;
  badge.className = 'conf-badge ' + (val >= 0.9 ? 'conf-high' : val >= 0.6 ? 'conf-mid' : 'conf-low');
  badge.textContent = Math.round(val * 100) + '%';
}

function updateDeleteBtn() {
  deleteSelectedBtn.disabled = state.selectedIds.size === 0;
}

function scrollBoxIntoView(id) {
  const el = ocrOverlay.querySelector(`[data-id="${id}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Mouse events on overlay ──────────────────────────────────────────────────
ocrOverlay.addEventListener('mousedown', onOverlayMouseDown);
ocrOverlay.addEventListener('mousemove', onMouseMove);
document.addEventListener('mouseup', onMouseUp);
ocrOverlay.addEventListener('contextmenu', onOverlayContextMenu);

function onOverlayMouseDown(e) {
  if (e.button !== 0) return;
  if (e.target.classList.contains('resize-handle')) return; // handled separately
  if (e.target.classList.contains('ocr-box') || e.target.closest('.ocr-box')) return;

  hideContextMenu();

  if (state.tool === 'draw') {
    // Start drawing
    const pos = clientToCanvas(e.clientX, e.clientY);
    state.drawing = true;
    state.drawStart = pos;
    selectionRect.style.display = 'block';
    selectionRect.style.left = (pos.x * state.zoom) + 'px';
    selectionRect.style.top = (pos.y * state.zoom) + 'px';
    selectionRect.style.width = '0';
    selectionRect.style.height = '0';
    e.preventDefault();
  } else {
    // Start selection rect
    const pos = clientToCanvas(e.clientX, e.clientY);
    state.selRect = true;
    state.selRectStart = pos;
    if (!e.shiftKey && !e.ctrlKey && !e.metaKey) state.selectedIds.clear();
    selectionRect.style.display = 'block';
    selectionRect.style.left = (pos.x * state.zoom) + 'px';
    selectionRect.style.top = (pos.y * state.zoom) + 'px';
    selectionRect.style.width = '0';
    selectionRect.style.height = '0';
    render();
    e.preventDefault();
  }
}

function onBoxMouseDown(e) {
  if (e.button !== 0) return;
  const handle = e.target.closest('.resize-handle');
  if (handle) {
    onResizeStart(e, handle);
    return;
  }
  hideContextMenu();
  const boxEl = e.target.closest('.ocr-box');
  if (!boxEl) return;
  const id = boxEl.dataset.id;

  if (state.tool === 'draw') return;

  if (!state.selectedIds.has(id)) {
    if (!e.shiftKey && !e.ctrlKey && !e.metaKey) state.selectedIds.clear();
    state.selectedIds.add(id);
    render();
  }

  // Start drag
  state.dragging = true;
  state.dragBox = id;
  const pos = clientToCanvas(e.clientX, e.clientY);
  state.dragOffsets = [...state.selectedIds].map(sid => {
    const b = state.boxes.find(b => b.id === sid);
    return { id: sid, dx: b.x - pos.x, dy: b.y - pos.y };
  });
  saveHistory();
  e.preventDefault();
  e.stopPropagation();
}

function onResizeStart(e, handle) {
  const id = handle.dataset.boxId;
  const dir = handle.dataset.handle;
  if (!state.selectedIds.has(id)) {
    state.selectedIds.clear();
    state.selectedIds.add(id);
    render();
  }
  const box = state.boxes.find(b => b.id === id);
  const pos = clientToCanvas(e.clientX, e.clientY);
  state.resizing = true;
  state.resizeBox = box;
  state.resizeHandle = dir;
  state.resizeStart = { ...pos, bx: box.x, by: box.y, bw: box.w, bh: box.h };
  saveHistory();
  e.preventDefault();
  e.stopPropagation();
}

function onMouseMove(e) {
  if (!state.imgLoaded) return;
  const pos = clientToCanvas(e.clientX, e.clientY);
  cursorPos.textContent = `x: ${Math.round(pos.x)}, y: ${Math.round(pos.y)}`;

  if (state.drawing) {
    const sx = state.drawStart.x, sy = state.drawStart.y;
    const x = Math.min(sx, pos.x), y = Math.min(sy, pos.y);
    const w = Math.abs(pos.x - sx), h = Math.abs(pos.y - sy);
    selectionRect.style.left = (x * state.zoom) + 'px';
    selectionRect.style.top = (y * state.zoom) + 'px';
    selectionRect.style.width = (w * state.zoom) + 'px';
    selectionRect.style.height = (h * state.zoom) + 'px';
  }

  if (state.selRect) {
    const sx = state.selRectStart.x, sy = state.selRectStart.y;
    const x = Math.min(sx, pos.x), y = Math.min(sy, pos.y);
    const w = Math.abs(pos.x - sx), h = Math.abs(pos.y - sy);
    selectionRect.style.left = (x * state.zoom) + 'px';
    selectionRect.style.top = (y * state.zoom) + 'px';
    selectionRect.style.width = (w * state.zoom) + 'px';
    selectionRect.style.height = (h * state.zoom) + 'px';
  }

  if (state.dragging) {
    state.dragOffsets.forEach(({ id, dx, dy }) => {
      const b = state.boxes.find(b => b.id === id);
      if (!b) return;
      b.x = Math.max(0, Math.round(pos.x + dx));
      b.y = Math.max(0, Math.round(pos.y + dy));
    });
    renderBoxes();
    renderProperties();
  }

  if (state.resizing) {
    const { bx, by, bw, bh, x: sx, y: sy } = state.resizeStart;
    const dx = pos.x - sx, dy = pos.y - sy;
    const b = state.resizeBox;
    const dir = state.resizeHandle;
    let nx = bx, ny = by, nw = bw, nh = bh;
    if (dir.includes('e')) nw = Math.max(10, bw + dx);
    if (dir.includes('s')) nh = Math.max(10, bh + dy);
    if (dir.includes('w')) { nx = bx + dx; nw = Math.max(10, bw - dx); if (nw <= 10) { nx = bx + bw - 10; nw = 10; } }
    if (dir.includes('n')) { ny = by + dy; nh = Math.max(10, bh - dy); if (nh <= 10) { ny = by + bh - 10; nh = 10; } }
    b.x = Math.round(nx); b.y = Math.round(ny);
    b.w = Math.round(nw); b.h = Math.round(nh);
    renderBoxes();
    renderProperties();
  }
}

function onMouseUp(e) {
  if (state.drawing) {
    state.drawing = false;
    selectionRect.style.display = 'none';
    const pos = clientToCanvas(e.clientX, e.clientY);
    const sx = state.drawStart.x, sy = state.drawStart.y;
    const x = Math.min(sx, pos.x), y = Math.min(sy, pos.y);
    const w = Math.abs(pos.x - sx), h = Math.abs(pos.y - sy);
    if (w > 5 && h > 5) {
      saveHistory();
      const box = createBox(x, y, w, h);
      state.boxes.push(box);
      state.selectedIds.clear();
      state.selectedIds.add(box.id);
      render();
      statusMsg.textContent = `新增框框: ${box.label}`;
    }
  }

  if (state.selRect) {
    state.selRect = false;
    selectionRect.style.display = 'none';
    const pos = clientToCanvas(e.clientX, e.clientY);
    const sx = state.selRectStart.x, sy = state.selRectStart.y;
    const rx = Math.min(sx, pos.x), ry = Math.min(sy, pos.y);
    const rw = Math.abs(pos.x - sx), rh = Math.abs(pos.y - sy);
    if (rw > 3 && rh > 3) {
      state.boxes.forEach(b => {
        if (b.x < rx + rw && b.x + b.w > rx && b.y < ry + rh && b.y + b.h > ry) {
          state.selectedIds.add(b.id);
        }
      });
    }
    render();
  }

  if (state.dragging) {
    state.dragging = false;
    state.dragBox = null;
    state.dragOffsets = [];
    render();
  }

  if (state.resizing) {
    state.resizing = false;
    state.resizeBox = null;
    state.resizeHandle = null;
    render();
  }
}

// ─── Context menu ─────────────────────────────────────────────────────────────
function onBoxContextMenu(e) {
  e.preventDefault();
  e.stopPropagation();
  const boxEl = e.target.closest('.ocr-box');
  if (boxEl) {
    const id = boxEl.dataset.id;
    if (!state.selectedIds.has(id)) {
      state.selectedIds.clear();
      state.selectedIds.add(id);
      render();
    }
  }
  showContextMenu(e.clientX, e.clientY);
}
function onOverlayContextMenu(e) {
  e.preventDefault();
  state.ctxMenuPos = clientToCanvas(e.clientX, e.clientY);
  showContextMenu(e.clientX, e.clientY);
}
function showContextMenu(x, y) {
  contextMenu.style.left = x + 'px';
  contextMenu.style.top = y + 'px';
  contextMenu.classList.add('visible');
}
function hideContextMenu() {
  contextMenu.classList.remove('visible');
}
document.addEventListener('click', hideContextMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideContextMenu(); if (state.tool === 'draw') setTool('select'); } });

document.getElementById('ctx-select-all').onclick = () => { state.selectedIds = new Set(state.boxes.map(b => b.id)); render(); };
document.getElementById('ctx-deselect').onclick = () => { state.selectedIds.clear(); render(); };
document.getElementById('ctx-add').onclick = () => {
  if (!state.imgLoaded) return;
  saveHistory();
  const pos = state.ctxMenuPos;
  const box = createBox(pos.x - 40, pos.y - 20, 80, 40);
  state.boxes.push(box);
  state.selectedIds.clear();
  state.selectedIds.add(box.id);
  render();
};
document.getElementById('ctx-delete').onclick = deleteSelected;

// ─── Tools ────────────────────────────────────────────────────────────────────
function setTool(tool) {
  state.tool = tool;
  document.getElementById('tool-select').classList.toggle('active', tool === 'select');
  document.getElementById('tool-draw').classList.toggle('active', tool === 'draw');
  canvasContainer.style.cursor = tool === 'draw' ? 'crosshair' : '';
  statusMsg.textContent = tool === 'draw' ? '繪製模式：在圖片上拖曳以新增 OCR 框框' : '選取模式';
}
document.getElementById('tool-select').onclick = () => setTool('select');
document.getElementById('tool-draw').onclick = () => setTool(state.tool === 'draw' ? 'select' : 'draw');

// ─── Zoom ─────────────────────────────────────────────────────────────────────
function setZoom(z) {
  state.zoom = Math.max(0.1, Math.min(5, z));
  zoomDisplay.textContent = Math.round(state.zoom * 100) + '%';
  canvasImg.style.width = (state.imgNaturalW * state.zoom) + 'px';
  canvasImg.style.height = (state.imgNaturalH * state.zoom) + 'px';
  canvasContainer.style.width = (state.imgNaturalW * state.zoom) + 'px';
  canvasContainer.style.height = (state.imgNaturalH * state.zoom) + 'px';
  renderBoxes();
}
document.getElementById('zoom-in-btn').onclick = () => setZoom(state.zoom * 1.2);
document.getElementById('zoom-out-btn').onclick = () => setZoom(state.zoom / 1.2);
document.getElementById('zoom-reset-btn').onclick = () => setZoom(1);
document.getElementById('zoom-fit-btn').onclick = fitZoom;

function fitZoom() {
  if (!state.imgLoaded) return;
  const scrollRect = canvasScroll.getBoundingClientRect();
  const fw = (scrollRect.width - 64) / state.imgNaturalW;
  const fh = (scrollRect.height - 64) / state.imgNaturalH;
  setZoom(Math.min(fw, fh, 1));
}

canvasScroll.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    setZoom(state.zoom * delta);
  }
}, { passive: false });

// ─── Image loading ─────────────────────────────────────────────────────────────
function loadImage(src) {
  canvasImg.onload = () => {
    state.imgNaturalW = canvasImg.naturalWidth;
    state.imgNaturalH = canvasImg.naturalHeight;
    state.imgLoaded = true;
    imgSizeInfo.textContent = `${state.imgNaturalW} × ${state.imgNaturalH} px`;
    dropZoneWrap.style.display = 'none';
    canvasContainer.style.display = 'block';
    setZoom(1);
    fitZoom();
    render();
    statusMsg.textContent = '圖片載入成功';
  };
  canvasImg.src = src;
}

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  loadImage(url);
}

uploadImage.addEventListener('change', e => handleFile(e.target.files[0]));
dropZoneInput.addEventListener('change', e => handleFile(e.target.files[0]));

// Drop
const dropZone = document.getElementById('drop-zone');
['dragover', 'dragenter'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag-over'); }));
['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, () => dropZone.classList.remove('drag-over')));
dropZone.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });

// ─── Delete ───────────────────────────────────────────────────────────────────
function deleteSelected() {
  if (state.selectedIds.size === 0) return;
  saveHistory();
  state.boxes = state.boxes.filter(b => !state.selectedIds.has(b.id));
  state.selectedIds.clear();
  render();
  statusMsg.textContent = '已刪除選取的框框';
}
document.getElementById('delete-selected-btn').onclick = deleteSelected;
document.getElementById('select-all-btn').onclick = () => {
  state.selectedIds = new Set(state.boxes.map(b => b.id));
  render();
};

// ─── Keyboard shortcuts ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
  if (e.key === 'v' || e.key === 'V') setTool('select');
  if (e.key === 'b' || e.key === 'B') setTool('draw');
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) { e.preventDefault(); redo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'a') { e.preventDefault(); state.selectedIds = new Set(state.boxes.map(b => b.id)); render(); }
  // Arrow keys to nudge
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key) && state.selectedIds.size > 0) {
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    saveHistory();
    state.selectedIds.forEach(id => {
      const b = state.boxes.find(b => b.id === id);
      if (!b) return;
      if (e.key === 'ArrowUp') b.y = Math.max(0, b.y - step);
      if (e.key === 'ArrowDown') b.y += step;
      if (e.key === 'ArrowLeft') b.x = Math.max(0, b.x - step);
      if (e.key === 'ArrowRight') b.x += step;
    });
    render();
  }
});

document.getElementById('undo-btn').onclick = undo;
document.getElementById('redo-btn').onclick = redo;

// ─── JSON Export / Import ─────────────────────────────────────────────────────
document.getElementById('apply-btn').onclick = () => {
  const fields = exportFields();
  setComponentValue({
    fields,
    blocks: state.boxes.map(b => ({
      id: b.id,
      label: b.label,
      field_key: b.fieldKey,
      box_type: b.boxType,
      parent_field_key: b.parentFieldKey,
      sub_key: b.subKey,
      text: b.text,
      bbox: { x: b.x, y: b.y, width: b.w, height: b.h },
      confidence: b.confidence,
      page: b.page,
    })),
  });
  statusMsg.textContent = `已套用 ${fields.length} 個欄位修改`;
};

document.getElementById('export-json-btn').onclick = () => {
  const data = {
    imageSize: { width: state.imgNaturalW, height: state.imgNaturalH },
    fields: exportFields(),
    blocks: state.boxes.map(b => ({
      id: b.id, label: b.label, field_key: b.fieldKey, text: b.text,
      bbox: { x: b.x, y: b.y, width: b.w, height: b.h },
      confidence: b.confidence,
      page: b.page,
    })),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ocr-boxes.json';
  a.click();
  statusMsg.textContent = 'JSON 已匯出';
};

document.getElementById('import-json-btn').onclick = () => document.getElementById('import-json-input').click();
document.getElementById('import-json-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      saveHistory();
      state.originalFields = Array.isArray(data.fields) ? JSON.parse(JSON.stringify(data.fields)) : state.originalFields;
      if (Array.isArray(data.fields)) {
        state.boxes = data.fields.flatMap(fieldToBoxes);
      } else {
        state.boxes = (data.blocks || []).map((b, i) => ({
          id: b.id || ('box_' + (state.nextId++)),
          x: b.bbox?.x ?? b.x ?? 0,
          y: b.bbox?.y ?? b.y ?? 0,
          w: b.bbox?.width ?? b.w ?? 100,
          h: b.bbox?.height ?? b.h ?? 40,
          text: b.text || b.field_key || '',
          label: b.label || `區塊 ${i+1}`,
          fieldKey: b.field_key || b.fieldKey || '',
          fieldIndex: i,
          page: b.page ?? 1,
          boxType: b.box_type || b.boxType || 'field',
          parentFieldKey: b.parent_field_key || b.parentFieldKey || '',
          subKey: b.sub_key || b.subKey || '',
          originalField: b.originalField || null,
          confidence: b.confidence ?? 1,
          color: boxColor(i),
        }));
      }
      render();
      statusMsg.textContent = `已匯入 ${state.boxes.length} 個框框`;
    } catch(err) {
      statusMsg.textContent = 'JSON 格式錯誤';
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ─── Theme toggle ─────────────────────────────────────────────────────────────
(function(){
  const t = document.querySelector('[data-theme-toggle]');
  const r = document.documentElement;
  let d = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  r.setAttribute('data-theme', d);
  t && t.addEventListener('click', () => {
    d = d === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', d);
    t.setAttribute('aria-label', '切換主題');
    t.innerHTML = d === 'dark'
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  });
})();

  if (!state.initializedFromStreamlit) {
    saveHistory();
    setFrameHeight();
